[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "embeddedflow"
version = "0.3.0"
description = "Project-local Evidence-DAG workflow CLI for embedded software"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6"]

[project.scripts]
ef = "embeddedflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"
